    <body>
        <header id="header">
            <div class="container">
                <div class="header_inner">
                    <div id="logo">
                        <a href="#"><img src="img/logo.jpg" alt="로고" /></a>
                    </div>
                    <nav id="nav">
                        <ul>
                            <li><a href="#">개인보증상품</a></li>
                            <li><a href="#">기업보증상품</a></li>
                            <li><a href="#">보증업무지원</a></li>
                            <li><a href="#">보증현황</a></li>
                            <li><a href="#">고객지원센터</a></li>
                        </ul>
                    </nav>
                    <div class="menu_box">
                        <span class="totalmenu">전체메뉴</span>
                        <form class="search_box">
                            <input type="text" placeholder="힌트문자" />
                            <button><span class="ir">버튼</span></button>
                            <!-- 위의 글로 버튼과 박스를 만듬 -->
                            <!-- span ir reset ir과 동일  -->
                        </form>
                    </div>
                </div>
            </div>
        </header>

        <main id="main">
            <div class="container">
                <h2 class="ir">여기서보터는 시각</h2>
                <div class="main_inner">
                    <div class="left_content">
                        <div class="left_box01">
                            <p class="sub_title">안전한 내집 마련을 위한</p>
                            <p class="title">개인보증</p>
                            <p class="box_title">내게 맞는 보증 상품 찾기</p>
                            <div class="box_img"><img src="img/img_01.jpg" alt="개인보증이미지" /></div>
                        </div>
                        <div class="left_box02 brown">
                            <p class="title02">전세보증금반환보증</p>
                            <p class="sub_title02">임차인의 보증금을 안전하게 <br />책임지는 보증금 상품</p>
                            <div class="arrow_img"><img src="img/arrow_01.jpg" /></div>
                            <div class="dot_img"><img src="img/dot_01.jpg" /></div>
                            <div class="hug_img"><img src="img/img_03.jpg" /></div>
                        </div>
                        <div class="left_box03 brown center">보증신청</div>
                        <div class="left_box04 brown center">보증조회/변경</div>
                    </div>

                    <div class="center_content">
                        <img src="img/center_img.jpg" alt="hug" />
                    </div>

                    <div class="right_content">
                        <div class="right_box01">
                            <p class="sub_title">성공적인 주택사업을 위한</p>
                            <p class="title">기업보증</p>
                            <p class="box_title">내게 맞는 보증 상품 찾기</p>
                            <div class="box_img"><img src="img/img_02.jpg" alt="기업보증" /></div>
                        </div>
                        <div class="right_box02">
                            <p class="title02">주택분양보증</p>
                            <p class="sub_title02">
                                주택의 분양의 이행 또는 납부한 계약금 및 중도금의 환급을 책임지는 보증상품
                                <br />
                            </p>
                            <div class="arrow_img"><img src="img/arrow_02.jpg" /></div>
                            <div class="dot_img"><img src="img/dot_02.jpg" /></div>
                            <div class="box_img"><img src="img/img_04.jpg" /></div>
                        </div>
                        <div class="right_box03 white center">보증신청</div>
                        <div class="right_box04 white center">보증조회/변경</div>
                    </div>
                </div>
            </div>
